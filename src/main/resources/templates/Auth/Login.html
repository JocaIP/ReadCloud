<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReadCloud - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #8B4513;
            --primary-dark: #654321;
            --secondary: #2F4F4F;
            --accent: #A0522D;
            --light: #F5F5F5;
            --success: #556B2F;
            --warning: #D2691E;
            --danger: #8B0000;
            --cloud: #F8F8F8;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--cloud);
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Animated Background */
        .cloud-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(135deg, #F5F5DC 0%, #F5F5F5 100%);
            overflow: hidden;
        }

        .cloud {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.7;
            animation: float 20s infinite linear;
        }

        .cloud:nth-child(1) {
            width: 200px;
            height: 60px;
            top: 10%;
            left: 5%;
            animation-duration: 25s;
        }

        .cloud:nth-child(2) {
            width: 300px;
            height: 100px;
            top: 25%;
            right: 10%;
            animation-duration: 30s;
            animation-delay: 5s;
        }

        .cloud:nth-child(3) {
            width: 250px;
            height: 80px;
            bottom: 15%;
            left: 15%;
            animation-duration: 35s;
            animation-delay: 10s;
        }

        @keyframes float {
            0% { transform: translateX(-100px); }
            100% { transform: translateX(calc(100vw + 100px)); }
        }

        /* Navbar */
        .navbar {
            background: rgba(255, 255, 255, 0.95) !important;
            backdrop-filter: blur(10px);
            padding: 1rem 0;
            box-shadow: 0 2px 15px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 1.8rem;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Login Container */
        .login-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 0;
        }

        .login-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            width: 100%;
            max-width: 450px;
            transition: all 0.3s ease;
        }

        .login-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
        }

        .login-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: white;
            padding: 2rem;
            text-align: center;
        }

        .login-header h2 {
            margin: 0;
            font-weight: 700;
        }

        .login-body {
            padding: 2rem;
        }

        .form-control {
            border-radius: 10px;
            padding: 12px 15px;
            border: 1px solid #ddd;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 0.2rem rgba(139, 69, 19, 0.25);
        }

        .form-label {
            font-weight: 600;
            color: var(--secondary);
            margin-bottom: 8px;
        }

        .btn-login {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            border: none;
            color: white;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s ease;
            width: 100%;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(139, 69, 19, 0.4);
        }

        .login-footer {
            text-align: center;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #eee;
        }

        .login-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .login-footer a:hover {
            color: var(--accent);
        }

        /* Floating Books */
        .floating-books {
            position: absolute;
            right: 5%;
            top: 50%;
            transform: translateY(-50%);
            width: 300px;
            height: 300px;
            display: none;
        }

        @media (min-width: 1200px) {
            .floating-books {
                display: block;
            }
        }

        .book {
            position: absolute;
            width: 80px;
            height: 100px;
            background: white;
            border-radius: 5px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: var(--primary);
            animation: float-book 6s infinite ease-in-out;
        }

        .book:nth-child(1) {
            top: 10%;
            left: 10%;
            animation-delay: 0s;
            background: linear-gradient(135deg, #DEB887 0%, #F5DEB3 100%);
        }

        .book:nth-child(2) {
            top: 30%;
            right: 20%;
            animation-delay: 1s;
            background: linear-gradient(135deg, #BC8F8F 0%, #F0E68C 100%);
        }

        .book:nth-child(3) {
            bottom: 20%;
            left: 20%;
            animation-delay: 2s;
            background: linear-gradient(135deg, #D2B48C 0%, #F5F5DC 100%);
        }

        @keyframes float-book {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        /* Footer */
        footer {
            background: var(--secondary);
            color: white;
            padding: 2rem 0 1rem;
            margin-top: auto;
        }

        .footer-links a {
            color: #bdbdbd;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .footer-links a:hover {
            color: white;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .login-container {
                padding: 1rem;
            }

            .login-card {
                max-width: 100%;
            }

            .floating-books {
                display: none;
            }
        }
    </style>
</head>
<body>

<!-- Animated Background -->
<div class="cloud-bg">
    <div class="cloud"></div>
    <div class="cloud"></div>
    <div class="cloud"></div>
</div>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-light">
    <div class="container">
        <a class="navbar-brand" th:href="@{/static}">
            <i class="fas fa-cloud me-2"></i>ReadCloud
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/static}">Início</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/livros}">Explorar Livros</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/sobre}">Sobre</a>
                </li>
            </ul>

            <div class="navbar-nav">
                <div th:unless="${#authentication.authenticated}">
                    <a class="nav-link active" th:href="@{/login}">
                        <i class="fas fa-sign-in-alt me-1"></i> Entrar
                    </a>
                    <a class="btn btn-primary ms-2" th:href="@{/Cadastro}">
                        <i class="fas fa-user-plus me-1"></i> Cadastrar
                    </a>
                </div>
            </div>
        </div>
    </div>
</nav>

<!-- Login Container -->
<div class="login-container">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="login-card">
                    <div class="login-header">
                        <h2><i class="fas fa-sign-in-alt me-2"></i>Entrar na Conta</h2>
                        <p class="mb-0 mt-2">Acesse sua biblioteca na nuvem</p>
                    </div>
                    <div class="login-body">
                        <form th:action="@{/login}" method="post">
                            <div class="mb-3">
                                <label for="email" class="form-label">E-mail</label>
                                <input type="email" class="form-control" id="email" name="username" placeholder="seu@email.com" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Senha</label>
                                <input type="password" class="form-control" id="password" name="password" placeholder="Sua senha" required>
                            </div>
                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="remember">
                                <label class="form-check-label" for="remember">Lembrar de mim</label>
                            </div>
                            <button type="submit" class="btn btn-login mb-3">
                                <i class="fas fa-sign-in-alt me-2"></i> Entrar
                            </button>
                        </form>

                        <div class="login-footer">
                            <p>Não tem uma conta? <a th:href="@{/Auth/Cadastro}">Cadastre-se aqui</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Floating Books -->
<div class="floating-books">
    <div class="book"><i class="fas fa-book"></i></div>
    <div class="book"><i class="fas fa-book-open"></i></div>
    <div class="book"><i class="fas fa-bookmark"></i></div>
</div>

<!-- Footer -->
<footer>
    <div class="container">
        <div class="row align-items-center">
            <div class="col-md-6 mb-4 mb-md-0">
                <h4 class="fw-bold">
                    <i class="fas fa-cloud me-2"></i> ReadCloud
                </h4>
                <p class="mb-0">Sua biblioteca digital na nuvem</p>
            </div>
            <div class="col-md-6 text-md-end text-center">
                <div class="footer-links">
                    <a th:href="@{/sobre}" class="me-3">Sobre</a>
                    <a th:href="@{/contato}" class="me-3">Contato</a>
                    <a th:href="@{/livros}" class="me-3">Livros</a>
                    <a href="#">Ajuda</a>
                </div>
            </div>
        </div>
        <hr class="my-4" style="border-color: rgba(255,255,255,0.2);">
        <div class="text-center">
            <p class="mb-0 small">&copy; 2024 ReadCloud. Todos os direitos reservados.</p>
        </div>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
