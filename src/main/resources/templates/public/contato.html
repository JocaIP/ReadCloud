<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - ReadCloud</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #5d4037;
            --secondary: #455a64;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: #f5f5f5;
        }

        .navbar {
            background: var(--secondary) !important;
        }

        .btn-primary {
            background: var(--primary);
            border: none;
        }

        footer {
            background: var(--secondary);
            color: white;
        }

        .contact-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }
    </style>
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <h1 class="text-center mb-4">Entre em Contato</h1>

            <div class="row g-4">
                <div class="col-md-6">
                    <div class="card contact-card h-100">
                        <div class="card-body text-center">
                            <i class="fas fa-envelope fa-3x text-primary mb-3"></i>
                            <h4>Email</h4>
                            <p class="text-muted">contato@readcloud.com</p>
                            <small>Respondemos em até 24h</small>
                        </div>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="card contact-card h-100">
                        <div class="card-body text-center">
                            <i class="fas fa-phone fa-3x text-primary mb-3"></i>
                            <h4>Telefone</h4>
                            <p class="text-muted">(11) 9999-9999</p>
                            <small>Segunda a Sexta, 9h às 18h</small>
                        </div>
                    </div>
                </div>
            </div>
            <div class="text-center mt-5">
                <a th:href="@{/templates/public}" class="btn btn-primary">
                    <i class="fas fa-home me-2"></i>Voltar ao Início
                </a>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
