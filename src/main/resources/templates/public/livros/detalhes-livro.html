<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${livro.titulo} + ' | ReadCloud'">Detalhes do Livro</title>

    <!-- Bootstrap + FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --primary: #8B4513;
            --accent: #A0522D;
            --secondary: #2F4F4F;
            --light: #F8F8F8;
            --success: #556B2F;
            --danger: #8B0000;
        }

        body {
            background: var(--light);
            font-family: "Segoe UI", system-ui, sans-serif;
        }

        .navbar {
            background: rgba(255,255,255,0.95) !important;
            backdrop-filter: blur(10px);
            padding: 1rem 0;
            box-shadow: 0 2px 15px rgba(0,0,0,0.1);
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 1.8rem;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .book-cover-box {
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        .book-cover {
            width: 100%;
            height: 420px;
            object-fit: cover;
        }

        .book-title {
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .btn-alugar {
            background: linear-gradient(135deg, var(--success), #6B8E23);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 600;
        }

        .btn-favorito {
            background: linear-gradient(135deg, #dc3545, #c82333);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 600;
        }

        .info-box {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.06);
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-light sticky-top">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">
            <i class="fas fa-cloud me-2"></i> ReadCloud
        </a>

        <a th:href="@{/livros}" class="btn btn-outline-primary btn-sm">
            <i class="fas fa-arrow-left me-1"></i> Voltar
        </a>
    </div>
</nav>

<div class="container my-5">

    <!-- ALERTAS -->
    <div th:if="${sucesso}" class="alert alert-success alert-dismissible fade show">
        <i class="fas fa-check-circle me-2"></i> <span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show">
        <i class="fas fa-exclamation-circle me-2"></i> <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="row g-4">

        <!-- CAPA DO LIVRO -->
        <div class="col-md-4">
            <div class="book-cover-box">
                <img th:if="${livro.imagemCapa != null}"
                     th:src="@{'/uploads/' + ${livro.imagemCapa}}"
                     class="book-cover">

                <img th:if="${livro.imagemCapa == null}"
                     src="https://cdn-icons-png.flaticon.com/512/29/29302.png"
                     class="book-cover">
            </div>
        </div>

        <!-- INFORMAÇÕES DO LIVRO -->
        <div class="col-md-8">

            <h2 class="book-title" th:text="${livro.titulo}"></h2>

            <p class="text-muted"><strong>Autor:</strong> <span th:text="${livro.autor}"></span></p>
            <p class="text-muted"><strong>Editora:</strong> <span th:text="${livro.editora}"></span></p>
            <p class="text-muted"><strong>Ano:</strong> <span th:text="${livro.anoPublicacao}"></span></p>

            <!-- CATEGORIA SEGURA (SEM NULL) -->
            <p class="text-muted">
                <strong>Categoria:</strong>
                <span th:text="${livro.categoria != null ? livro.categoria.nome : 'Sem categoria'}"></span>
            </p>

            <!-- STATUS -->
            <p class="mt-2">
                <strong>Status:</strong>

                <span th:if="${livro.quantidade > 0}" class="text-success fw-bold">
                    <i class="fas fa-check-circle"></i> Disponível
                </span>

                <span th:if="${livro.quantidade <= 0}" class="text-danger fw-bold">
                    <i class="fas fa-times-circle"></i> Indisponível
                </span>
            </p>

            <hr>

            <p class="lead" th:text="${livro.descricao}"></p>

            <!-- ESTRELAS MÉDIA -->
            <div class="my-3">
                <i th:each="i : ${#numbers.sequence(1,5)}"
                   th:class="${i <= mediaAvaliacoes} ? 'fas fa-star text-warning' : 'far fa-star text-warning'"></i>
            </div>

            <!-- AÇÕES (ALUGAR / FAVORITAR) -->
            <div class="d-flex gap-3 flex-wrap">
                <!-- ALUGAR -->
                <form th:action="@{/carrinho/adicionar/{id}(id=${livro.id})}" method="post">
                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}"/>

                    <button class="btn btn-alugar"
                            th:disabled="${livro.quantidade <= 0}">
                        <i class="fas fa-hand-holding me-1"></i>
                        <span th:text="${livro.quantidade > 0 ? 'Alugar Livro' : 'Indisponível'}"></span>
                    </button>
                </form>

                <!-- FAVORITO -->
                <form th:action="@{/livros/desejar/{id}(id=${livro.id})}" method="post">
                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}"/>
                    <button class="btn btn-favorito">
                        <i class="fas fa-heart me-1"></i> Adicionar aos Favoritos
                    </button>
                </form>
            </div>

            <!-- REGRAS DO EMPRÉSTIMO -->
            <div class="info-box mt-4">
                <h6 class="fw-bold"><i class="fas fa-info-circle me-1"></i>Informações do Empréstimo</h6>
                <ul class="small mt-2">
                    <li>Prazo: 14 dias</li>
                    <li>Multa: R$ 2,00 por dia</li>
                    <li>Limite: 3 livros por usuário</li>
                </ul>
            </div>
        </div>
    </div>

    <hr class="my-5">

    <!-- FORMULÁRIO DE AVALIAÇÃO -->
    <h4 class="fw-bold mb-4"><i class="fas fa-comments me-2"></i>Avaliações</h4>

    <!-- SE LOGADO: MOSTRA FORM -->
    <div th:if="${usuarioLogado}" class="mb-5">
        <form th:action="@{/livros/avaliar/{id}(id=${livro.id})}"
              method="post"
              class="p-4 bg-white rounded shadow-sm">

            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <h5 class="fw-bold mb-3">Deixe sua avaliação</h5>

            <!-- NOTA -->
            <div class="mb-3">
                <label class="form-label fw-bold">Nota:</label>
                <div class="d-flex gap-3">
                    <label th:each="i : ${#numbers.sequence(1,5)}" class="form-check-label">
                        <input type="radio" name="rating" th:value="${i}" class="form-check-input me-1" required>
                        <i class="fas fa-star text-warning"></i> <span th:text="${i}"></span>
                    </label>
                </div>
            </div>

            <!-- COMENTÁRIO -->
            <div class="mb-3">
                <label class="form-label fw-bold">Comentário:</label>
                <textarea name="comentario" class="form-control" rows="4" required
                          placeholder="Conte sua experiência com o livro..."></textarea>
            </div>

            <button class="btn btn-primary fw-bold">
                <i class="fas fa-paper-plane me-1"></i> Enviar Avaliação
            </button>
        </form>
    </div>

    <!-- SE NÃO LOGADO: AVISO -->
    <div th:if="${!usuarioLogado}" class="alert alert-info">
        <i class="fas fa-info-circle me-1"></i>
        Faça <a th:href="@{/login}" class="fw-bold">login</a> para avaliar este livro.
    </div>

    <!-- LISTA DE AVALIAÇÕES -->
    <div th:if="${#lists.isEmpty(avaliacoes)}" class="text-center p-4 text-muted">
        <i class="fas fa-comment-slash fa-2x mb-2"></i>
        <p>Nenhuma avaliação ainda.</p>
    </div>

    <div th:each="av : ${avaliacoes}" class="p-3 bg-white shadow-sm rounded mb-3">
        <div class="d-flex justify-content-between">
            <strong th:text="${av.usuario.nome}"></strong>
            <small class="text-muted"
                   th:text="${#temporals.format(av.dataAvaliacao,'dd/MM/yyyy HH:mm')}"></small>
        </div>

        <div class="mt-2">
            <i th:each="i : ${#numbers.sequence(1,5)}"
               th:class="${i <= av.rating} ? 'fas fa-star text-warning' : 'far fa-star text-warning'"></i>
        </div>

        <p class="mt-2" th:text="${av.comentario}"></p>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
