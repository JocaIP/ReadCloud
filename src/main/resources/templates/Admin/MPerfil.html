<!-- templates/Admin/MPerfil.html -->
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Meu Perfil — Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --primary:#8B4513; --accent:#A0522D; }
        .avatar { width:88px; height:88px; border-radius:999px; background:linear-gradient(90deg,var(--primary),var(--accent)); color:#fff; display:flex; align-items:center; justify-content:center; font-size:28px;}
    </style>
</head>
<body>
<div class="container py-4">
    <div class="card p-3">
        <div class="d-flex gap-3">
            <div class="avatar">AD</div>
            <div>
                <h5 th:text="${nomeAdmin != null} ? ${nomeAdmin} : 'Administrador'">Administrador</h5>
                <p class="text-muted" th:text="${emailAdmin != null} ? ${emailAdmin} : 'admin@exemplo.com'">admin@exemplo.com</p>
                <a th:href="@{/admin/configuracoes/emprestimos}" class="btn btn-outline-secondary btn-sm">Configurações</a>
            </div>
        </div>

        <hr>

        <div class="row">
            <div class="col-md-4">
                <div class="mb-3">
                    <h6>Total livros</h6>
                    <p th:text="${totalLivros}">0</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="mb-3">
                    <h6>Emprestados</h6>
                    <p th:text="${totalEmprestados}">0</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="mb-3">
                    <h6>Usuários</h6>
                    <p th:text="${totalUsuarios}">0</p>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
