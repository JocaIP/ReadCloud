<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Admin — Livros | ReadCloud</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        :root { --primary: #8B4513; --accent:  #A0522D; }
        body { font-family: "Segoe UI", sans-serif; background: #f5f5f5; }
        .topbar { background: linear-gradient(135deg, var(--primary), var(--accent)); color: #fff; padding: 1.2rem 0; }
        .btn-admin { background: rgba(255,255,255,0.2); color: white; border-radius: 8px; padding: 8px 16px; }
        .btn-primary-top { background: white; color: var(--primary); border-radius: 8px; padding: 8px 16px; font-weight: bold; }
        .card-book { border-radius: 14px; overflow: hidden; box-shadow: 0 3px 10px rgba(0,0,0,0.09); background: white; }
        .book-cover img { width: 100%; height: 220px; object-fit: cover; display:block; }
        .book-actions button, .book-actions a { flex: 1; }
    </style>
</head>

<body>

<!-- TOPBAR -->
<div class="topbar">
    <div class="container d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center">
            <i class="fas fa-book-open fa-2x me-3"></i>
            <div>
                <h4 class="mb-0 fw-bold">Gerenciamento de Livros</h4>
                <small>Administração do acervo</small>
            </div>
        </div>

        <div class="d-flex gap-2">

            <!-- Botão Painel -->
            <a th:href="@{/admin/painel}" class="btn btn-admin">
                <i class="fas fa-home me-1"></i> Painel
            </a>

            <!-- Botão Novo Livro -->
            <a th:href="@{/admin/livros/cadastrar}" class="btn btn-primary-top">
                <i class="fas fa-plus me-1"></i> Novo Livro
            </a>

            <!-- NOVO BOTÃO: Importar CSV -->
            <a th:href="@{/admin/livros/importar}" class="btn btn-primary-top">
                <i class="fas fa-file-csv me-1"></i> Importar CSV
            </a>

        </div>
    </div>
</div>

<div class="container my-4">

    <!-- FILTRAR / BUSCAR -->
    <form th:action="@{/admin/livros}" method="get" class="filters-section px-3 py-3 rounded bg-white shadow-sm">
        <div class="row mb-3">
            <div class="col-md-6">
                <input type="text" name="busca" th:value="${param.busca}" class="form-control" placeholder="Buscar por título, autor ou editora...">
            </div>

            <div class="col-md-4">
                <select name="categoria" class="form-select">
                    <option value="">Todas as categorias</option>
                    <option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nome}"
                            th:selected="${param.categoria != null and param.categoria == c.id}"></option>
                </select>
            </div>

            <div class="col-md-2 text-end">
                <button class="btn btn-primary btn-sm">
                    <i class="fas fa-search me-1"></i> Buscar
                </button>
            </div>
        </div>

        <div class="row">
            <div class="col-md-12 text-end small text-muted">
                <span th:text="'Resultados: ' + ${#lists.size(livros)}">Resultados: 0</span>
            </div>
        </div>
    </form>

    <!-- GRID DE LIVROS -->
    <div class="row g-4 mt-4">
        <div th:each="livro : ${livros}" class="col-12 col-sm-6 col-lg-4 col-xl-3">
            <div class="card-book">
                <div class="book-cover">
                    <img th:if="${livro.imagemCapa != null and livro.imagemCapa != ''}"
                         th:src="@{'/uploads/' + ${livro.imagemCapa}}" alt="Capa do livro">
                    <div th:if="${livro.imagemCapa == null or livro.imagemCapa == ''}"
                         style="height:220px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;">
                        <i class="fas fa-book fa-3x"></i>
                    </div>
                </div>

                <div class="p-3">
                    <h6 class="fw-bold mb-1" th:text="${livro.titulo}"></h6>
                    <small class="text-muted d-block mb-2" th:text="${livro.autor}"></small>
                    <p class="small mt-2" th:text="${#strings.abbreviate(livro.descricao, 80)}"></p>

                    <div class="d-flex justify-content-between align-items-center mt-3">
                        <span class="badge" th:classappend="${livro.quantidade > 0 ? 'bg-success' : 'bg-danger'}"
                              th:text="${livro.quantidade > 0 ? 'Disponível' : 'Indisponível'}"></span>

                        <div class="book-actions d-flex gap-2">
                            <a th:href="@{/admin/livros/editar/{id}(id=${livro.id})}" class="btn btn-warning btn-sm">
                                <i class="fas fa-edit"></i>
                            </a>

                            <form th:action="@{/admin/livros/excluir/{id}(id=${livro.id})}"
                                  method="post" onsubmit="return confirm('Excluir este livro?');">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                <button class="btn btn-danger btn-sm">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <!-- Nenhum livro -->
        <div class="col-12" th:if="${#lists.isEmpty(livros)}">
            <div class="text-center p-5 text-muted">
                <i class="fas fa-book-open fa-3x mb-3"></i>
                <h5>Nenhum livro encontrado</h5>
                <p>Verifique filtros ou cadastre novos livros.</p>
            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
