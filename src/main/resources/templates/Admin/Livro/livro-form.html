<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Livro - ReadCloud</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        :root { --primary: #8B4513; --accent: #A0522D; --secondary: #2F4F4F; --light: #F8F6F2; --card: #fffdf9; }
        body { background-color: var(--light); font-family: 'Segoe UI'; }
        .container { max-width: 900px; margin-top: 40px; background-color: var(--card); padding: 2rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .preview { max-width: 150px; max-height: 220px; border-radius: 8px; margin-top: 10px; display:block; }
        .btn-primary { background-color: var(--primary); border: none; }
        .btn-primary:hover { background-color: var(--accent); }
    </style>
</head>

<body>

<div class="container">

    <a th:href="@{/admin/livros}" class="btn btn-outline-secondary mb-3">
        <i class="fas fa-arrow-left me-2"></i> Voltar
    </a>

    <h2 class="fw-bold text-center mb-4">
        <i class="fas fa-book-open me-2"></i> Cadastrar Livro
    </h2>

    <div th:if="${sucesso}" class="alert alert-success text-center" th:text="${sucesso}"></div>
    <div th:if="${erro}" class="alert alert-danger text-center" th:text="${erro}"></div>

    <form th:action="@{/admin/livros/cadastrar}" th:object="${livro}" method="post" enctype="multipart/form-data">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <div class="mb-3">
            <label class="form-label">Título</label>
            <input th:field="*{titulo}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Autor</label>
            <input th:field="*{autor}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Editora</label>
            <input th:field="*{editora}" class="form-control">
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Ano de Publicação</label>
                <input type="number" th:field="*{anoPublicacao}" class="form-control">
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">ISBN</label>
                <input th:field="*{isbn}" class="form-control">
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Descrição</label>
            <textarea th:field="*{descricao}" class="form-control" rows="4"></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Quantidade</label>
            <input type="number" th:field="*{quantidade}" class="form-control" required min="0">
        </div>

        <div class="mb-3">
            <label class="form-label">Categoria</label>
            <select name="categoriaId" class="form-select" required>
                <option value="">Selecione...</option>
                <option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nome}"></option>
            </select>
        </div>

        <!-- UPLOAD PADRONIZADO -->
        <div class="mb-3">
            <label class="form-label">Imagem da Capa</label>
            <input type="file" name="imagemCapa" class="form-control" accept="image/*" onchange="previewImage(event)">
            <img id="preview" class="preview" style="display:none;" alt="Pré-visualização">
        </div>

        <div class="text-center mt-4">
            <button class="btn btn-primary px-4">
                <i class="fas fa-save me-2"></i> Salvar Livro
            </button>
        </div>
    </form>

</div>

<script>
    function previewImage(e){
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = x => {
            const img = document.getElementById("preview");
            img.src = x.target.result;
            img.style.display = "block";
        };
        reader.readAsDataURL(file);
    }
</script>

</body>
</html>
