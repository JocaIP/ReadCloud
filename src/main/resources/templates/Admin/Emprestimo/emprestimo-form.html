<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Novo Empréstimo</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>

    <style>
        :root {
            --primary: #8B4513;
            --primary-dark: #5d3410;
            --accent: #A0522D;
            --light: #F8F6F2;
        }

        body {
            background: var(--light);
            font-family: "Segoe UI", system-ui;
        }

        /* TOPBAR */
        .topbar {
            background: #fff;
            border-bottom: 1px solid rgba(0,0,0,0.06);
        }

        /* SIDEBAR */
        .sidebar {
            width: 250px;
            background: linear-gradient(180deg, var(--primary), var(--accent));
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            padding: 1.2rem;
            color: white;
        }

        .sidebar .nav-link {
            color: rgba(255,255,255,0.9);
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 6px;
        }

        .sidebar .nav-link.active,
        .sidebar .nav-link:hover {
            background: rgba(255,255,255,0.15);
            color: white;
        }

        /* MAIN CONTENT */
        .main {
            margin-left: 260px;
            padding: 32px;
        }

        .card-custom {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        }

        .page-title {
            color: var(--primary-dark);
            font-weight: bold;
        }
    </style>
</head>
<body>

<!-- TOPBAR -->
<nav class="topbar shadow-sm px-4 py-2 d-flex justify-content-between align-items-center">
    <a class="navbar-brand fw-bold d-flex align-items-center gap-2" th:href="@{/admin/painel}">
        <i class="fas fa-cloud" style="color:var(--primary)"></i>
        ReadCloud Admin
    </a>

    <form th:action="@{/logout}" method="post" class="m-0">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button class="btn btn-outline-primary btn-sm">
            <i class="fas fa-sign-out-alt me-1"></i> Sair
        </button>
    </form>
</nav>

<!-- SIDEBAR -->
<aside class="sidebar d-none d-lg-block">

    <div class="text-center mb-4">
        <h5 class="mb-0">Painel Admin</h5>
        <small>ReadCloud</small>
    </div>

    <nav class="nav flex-column">
        <a class="nav-link" th:href="@{/admin/painel}">
            <i class="fas fa-tachometer-alt me-2"></i> Painel
        </a>

        <a class="nav-link" th:href="@{/admin/livros}">
            <i class="fas fa-book me-2"></i> Livros
        </a>

        <a class="nav-link" th:href="@{/admin/categorias}">
            <i class="fas fa-tags me-2"></i> Categorias
        </a>

        <a class="nav-link" th:href="@{/admin/usuarios}">
            <i class="fas fa-users me-2"></i> Usuários
        </a>

        <a class="nav-link active" th:href="@{/admin/emprestimos}">
            <i class="fas fa-exchange-alt me-2"></i> Empréstimos
        </a>
    </nav>

</aside>

<!-- MAIN CONTENT -->
<main class="main">

    <h2 class="page-title mb-4">Novo Empréstimo</h2>

    <div class="card-custom">

        <form th:action="@{/admin/emprestimos/novo}" method="post">

            <!-- USUÁRIO -->
            <div class="mb-3">
                <label class="form-label fw-semibold">Usuário</label>
                <select class="form-select" name="usuarioId" required>
                    <option value="" disabled selected>Selecione um usuário</option>
                    <option th:each="u : ${usuarios}" th:value="${u.id}" th:text="${u.nome}"></option>
                </select>
            </div>

            <!-- LIVRO -->
            <div class="mb-3">
                <label class="form-label fw-semibold">Livro</label>
                <select class="form-select" name="livroId" required>
                    <option value="" disabled selected>Selecione um livro</option>
                    <option th:each="l : ${livros}" th:value="${l.id}"
                            th:text="${l.titulo + ' (' + l.quantidade + ' disponíveis)'}"></option>
                </select>
            </div>

            <hr class="my-4"/>

            <!-- BOTÕES -->
            <div class="d-flex justify-content-between">
                <a class="btn btn-secondary" th:href="@{/admin/emprestimos}">
                    <i class="fas fa-arrow-left me-1"></i> Voltar
                </a>

                <button class="btn btn-primary">
                    <i class="fas fa-check me-1"></i> Registrar Empréstimo
                </button>
            </div>

        </form>

    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
