<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Importar Usuários - ReadCloud</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="p-4">

<h2 class="mb-4">📥 Importar Usuários via CSV</h2>

<div th:if="${sucesso}" class="alert alert-success" th:text="${sucesso}"></div>
<div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

<form th:action="@{/admin/usuarios/importar}" method="post" enctype="multipart/form-data" class="border p-4 rounded bg-light">
    <div class="mb-3">
        <label class="form-label">Selecione o arquivo CSV</label>
        <input type="file" name="arquivo" class="form-control" required/>
    </div>

    <button class="btn btn-primary">Importar CSV</button>
    <a th:href="@{/admin/usuarios}" class="btn btn-secondary ms-2">Voltar</a>
</form>

<hr class="my-4">

<h5>📌 Formato esperado do CSV:</h5>
<pre class="bg-dark text-light p-3 rounded">
nome,email,senha,ativo,role
"João da Silva","joao@email.com","123456","true","USER"
</pre>

</body>
</html>
