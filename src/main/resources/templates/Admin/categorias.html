<!-- templates/Admin/categorias.html -->
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>Admin — Categorias | ReadCloud</title>

    <!-- Bootstrap + Font Awesome (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>

    <style>
        :root {
            --primary: #8B4513;
            --accent: #A0522D;
            --light: #F8F8F8;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, "Helvetica Neue", Arial;
            background: var(--light);
            color: #333;
        }
        .topbar {
            background: linear-gradient(90deg, var(--primary), var(--accent));
            color: #fff;
            padding: 12px 18px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
        }
        .panel {
            background: #fff;
            border-radius: 10px;
            padding: 18px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.04);
        }
        .btn-primary {
            background: linear-gradient(90deg, var(--primary), var(--accent));
            border: none;
        }
        .form-card {
            border-radius: 8px;
            border: 1px solid #eee;
            padding: 14px;
            background: #fff;
        }
        .table thead th {
            background: rgba(139,69,19,0.06);
        }
        .no-data {
            min-height: 120px;
            display:flex;
            align-items:center;
            justify-content:center;
        }
        @media (max-width: 576px) {
            .topbar .d-flex { flex-direction: column; gap:8px; align-items: flex-start; }
        }
    </style>
</head>
<body>
<div class="topbar d-flex justify-content-between align-items-center">
    <div>
        <h5 class="mb-0"><i class="fas fa-cloud me-2"></i> ReadCloud — Painel Admin</h5>
        <small>Gestão de Categorias</small>
    </div>
    <div class="d-flex gap-2 align-items-center">
        <a th:href="@{/admin/painel}" class="btn btn-outline-light btn-sm">
            <i class="fas fa-chevron-left me-1"></i> Painel
        </a>
        <button class="btn btn-light btn-sm" onclick="window.history.back();">
            <i class="fas fa-arrow-left me-1"></i> Voltar
        </button>
    </div>
</div>

<div class="container my-4">
    <!-- mensagens de feedback -->
    <div th:if="${sucesso}" class="alert alert-success" th:text="${sucesso}"></div>
    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

    <div class="row g-4">
        <!-- Formulário de cadastro -->
        <div class="col-lg-4">
            <div class="form-card">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h6 class="mb-0">Nova Categoria</h6>
                    <small class="text-muted">Adicione uma categoria ao acervo</small>
                </div>

                <form th:action="@{/admin/categorias/cadastrar}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <div class="mb-3">
                        <label class="form-label">Nome <span class="text-danger">*</span></label>
                        <input type="text" name="nome" class="form-control" placeholder="Ex: Ficção" required/>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Descrição</label>
                        <textarea name="descricao" rows="3" class="form-control" placeholder="Descrição opcional"></textarea>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-plus me-1"></i> Cadastrar Categoria
                        </button>
                        <a th:href="@{/admin/categorias}" class="btn btn-outline-secondary">Limpar</a>
                    </div>
                </form>
            </div>
        </div>

        <!-- Lista de categorias -->
        <div class="col-lg-8">
            <div class="panel">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div>
                        <h5 class="mb-0">Categorias</h5>
                        <small class="text-muted">Total: <span th:text="${#lists.size(categorias)}">0</span></small>
                    </div>
                    <div>
                        <a th:href="@{/admin/categorias}" class="btn btn-outline-secondary btn-sm">
                            <i class="fas fa-sync-alt me-1"></i> Atualizar
                        </a>
                    </div>
                </div>

                <div th:if="${#lists.isEmpty(categorias)}" class="no-data">
                    <div class="text-center w-100">
                        <p class="mb-0 text-muted"><i class="fas fa-info-circle me-1"></i> Nenhuma categoria encontrada.</p>
                    </div>
                </div>

                <div th:if="${!#lists.isEmpty(categorias)}">
                    <div class="table-responsive">
                        <table class="table align-middle">
                            <thead>
                            <tr>
                                <th scope="col">#</th>
                                <th scope="col">Nome</th>
                                <th scope="col">Descrição</th>
                                <th scope="col" class="text-center">Ações</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="cat, iterStat : ${categorias}">
                                <td th:text="${iterStat.index + 1}">1</td>
                                <td th:text="${cat.nome}">Nome da Categoria</td>
                                <td th:text="${cat.descricao} ?: '-'">Descrição</td>
                                <td class="text-center">
                                    <div class="d-flex gap-2 justify-content-center">
                                        <!-- Editar -->
                                        <a th:href="@{|/admin/categorias/editar/${cat.id}|}" class="btn btn-sm btn-outline-primary">
                                            <i class="fas fa-edit me-1"></i> Editar
                                        </a>

                                        <!-- Excluir -->
                                        <form th:action="@{|/admin/categorias/excluir/${cat.id}|}" method="post"
                                              onsubmit="return confirm('Deseja realmente excluir a categoria \"' + /*[[${cat.nome}]]*/ '' + '\"?');">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                        <button type="submit" class="btn btn-sm btn-outline-danger">
                                            <i class="fas fa-trash me-1"></i> Excluir
                                        </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<!-- Modal de edição (fallback se quiser usar via modal) -->
<!-- O seu controller deve prover rota /admin/categorias/editar/{id} que mostre formulário com categoria -->
<!-- (este modal é apenas estrutura; integrá-lo exige JS e endpoints extras) -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
