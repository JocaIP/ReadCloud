<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Minhas Avaliações - ReadCloud</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', sans-serif; }
        .header { background: linear-gradient(135deg, #8B4513, #A0522D); color: white; padding: 2.5rem 1rem; text-align: center; border-radius: 0 0 25px 25px; }
        .card-avaliacao { background: #fff; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.08); padding: 1.5rem; }
        .card-avaliacao:hover { transform: translateY(-5px); transition: 0.3s; }
        .stars i { color: #FFD700; }
    </style>
</head>
<body>
<div class="header">
    <h1><i class="fas fa-star me-2"></i> Minhas Avaliações</h1>
    <p class="lead">Veja suas avaliações de livros</p>
</div>

<div class="container mt-4">
    <div th:if="${#lists.isEmpty(avaliacoes)}" class="alert alert-info text-center">
        Você ainda não avaliou nenhum livro.
    </div>

    <div class="row g-3" th:each="av : ${avaliacoes}">
        <div class="col-md-6">
            <div class="card card-avaliacao">
                <h5 class="fw-bold" th:text="${av.livro.titulo}">Título do Livro</h5>
                <div class="stars mb-2">
                    <i class="fa-star" th:each="i : ${#numbers.sequence(1, av.nota)}" class="fas fa-star"></i>
                    <i class="fa-star" th:each="i : ${#numbers.sequence(av.nota+1, 5)}" class="far fa-star"></i>
                </div>
                <p class="text-muted" th:text="${av.comentario}">Comentário</p>

                <div class="d-flex justify-content-between">
                    <form th:action="@{/perfil/avaliacoes/remover/{id}(id=${av.id})}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button class="btn btn-outline-danger btn-sm"><i class="fas fa-trash"></i> Remover</button>
                    </form>
                    <a th:href="@{/livros/detalhes/{id}(id=${av.livro.id})}" class="btn btn-outline-primary btn-sm">
                        <i class="fas fa-eye"></i> Ver Livro
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div class="text-center mt-4">
        <a th:href="@{/perfil/meu}" class="btn btn-outline-primary"><i class="fas fa-arrow-left me-1"></i> Voltar ao Perfil</a>
    </div>
</div>
</body>
</html>
