<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Minha Lista de Desejos - ReadCloud</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', sans-serif;
        }

        .header {
            background: linear-gradient(135deg, #8B4513, #A0522D);
            color: white;
            padding: 2.5rem 1rem;
            text-align: center;
            border-radius: 0 0 25px 25px;
            margin-bottom: 2rem;
        }

        .card-livro {
            background: #fff;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: 0.3s;
            height: 100%;
            border: none;
        }

        .card-livro:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .livro-capa {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .livro-sem-capa {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #8B4513, #A0522D);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            margin-bottom: 15px;
            color: white;
        }

        .btn-primary {
            background: linear-gradient(135deg, #8B4513, #A0522D);
            border: none;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #A0522D, #8B4513);
            transform: translateY(-2px);
        }
    </style>
</head>

<body>

<!-- Header -->
<div class="header">
    <div class="container">
        <h1><i class="fas fa-heart me-2"></i> Minha Lista de Desejos</h1>
        <p class="lead">Livros que você deseja ler</p>
    </div>
</div>

<div class="container mt-4">

    <!-- Mensagens -->
    <div th:if="${sucesso}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Estado vazio -->
    <div th:if="${#lists.isEmpty(desejos)}" class="alert alert-info text-center py-5">
        <i class="fas fa-heart-broken fa-3x mb-3 text-muted"></i>
        <h4 class="text-muted">Sua lista de desejos está vazia</h4>
        <p class="text-muted">Explore nossa biblioteca e adicione livros que você gostaria de ler!</p>

        <a th:href="@{/livros}" class="btn btn-primary mt-3">
            <i class="fas fa-book me-1"></i> Explorar Livros
        </a>
    </div>

    <!-- Lista de desejos -->
    <div class="row g-4" th:unless="${#lists.isEmpty(desejos)}">
        <div class="col-md-6 col-lg-4" th:each="livro : ${desejos}">
            <div class="card card-livro p-3">

                <!-- Capa -->
                <div th:if="${livro.imagemCapa != null and livro.imagemCapa != ''}">
                    <img th:src="@{'/uploads/' + ${livro.imagemCapa}}"
                         alt="Capa do livro"
                         class="livro-capa"
                         onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" />

                    <div class="livro-sem-capa" style="display:none;">
                        <i class="fas fa-book fa-3x"></i>
                    </div>
                </div>

                <div th:unless="${livro.imagemCapa != null and livro.imagemCapa != ''}" class="livro-sem-capa">
                    <i class="fas fa-book fa-3x"></i>
                </div>

                <!-- Informações -->
                <h5 class="fw-bold" th:text="${livro.titulo}">Título</h5>
                <p class="text-muted mb-1" th:text="${livro.autor}">Autor</p>

                <p class="small text-muted" th:if="${livro.categoria}">
                    Categoria: <span th:text="${livro.categoria.nome}"></span>
                </p>

                <!-- Disponibilidade -->
                <div th:if="${livro.quantidade > 0}" class="mb-2">
                    <span class="badge bg-success">
                        <i class="fas fa-check"></i> Disponível
                    </span>
                </div>

                <div th:unless="${livro.quantidade > 0}" class="mb-2">
                    <span class="badge bg-warning text-dark">
                        <i class="fas fa-clock"></i> Indisponível
                    </span>
                </div>

                <!-- Botões -->
                <div class="d-flex justify-content-between align-items-center mt-3">

                    <a th:href="@{/livros/detalhes/{id}(id=${livro.id})}"
                       class="btn btn-outline-primary btn-sm">
                        <i class="fas fa-eye me-1"></i> Ver
                    </a>

                    <!-- Alugar -->
                    <form th:if="${livro.quantidade > 0}"
                          th:action="@{/livros/alugar/{id}(id=${livro.id})}"
                          method="post" class="d-inline">

                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button class="btn btn-success btn-sm">
                            <i class="fas fa-hand-holding"></i> Alugar
                        </button>
                    </form>

                    <!-- Remover -->
                    <form th:action="@{/perfil/desejos/remover/{id}(id=${livro.id})}"
                          method="post" class="d-inline">

                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button class="btn btn-outline-danger btn-sm"
                                onclick="return confirm('Deseja remover este livro dos desejos?')">
                            <i class="fas fa-trash"></i>
                        </button>
                    </form>

                </div>

            </div>
        </div>
    </div>

    <!-- Contador -->
    <div class="row mt-4" th:unless="${#lists.isEmpty(desejos)}">
        <div class="col-12">
            <div class="alert alert-info d-flex align-items-center">
                <i class="fas fa-heart text-danger me-2"></i>
                <span>
                    <b th:text="${#lists.size(desejos)}">0</b>
                    <span th:text="${#lists.size(desejos) == 1 ? ' livro' : ' livros'}"></span>
                    na sua lista de desejos
                </span>
            </div>
        </div>
    </div>

    <!-- Navegação -->
    <div class="text-center mt-4 mb-5">
        <a th:href="@{/perfil}" class="btn btn-outline-primary me-2">
            <i class="fas fa-arrow-left me-1"></i> Voltar ao Perfil
        </a>

        <a th:href="@{/livros}" class="btn btn-primary">
            <i class="fas fa-book me-1"></i> Explorar Mais Livros
        </a>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        setTimeout(() => {
            document.querySelectorAll(".alert").forEach(a => a.remove());
        }, 4000);
    });
</script>

</body>
</html>
