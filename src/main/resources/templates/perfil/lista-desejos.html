<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Minha Lista de Desejos - ReadCloud</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', sans-serif; }
        .header { background: linear-gradient(135deg, #8B4513, #A0522D); color: white; padding: 2.5rem 1rem; text-align: center; border-radius: 0 0 25px 25px; }
        .card-livro { background: #fff; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); transition: 0.3s; }
        .card-livro:hover { transform: translateY(-5px); }
    </style>
</head>
<body>
<div class="header">
    <h1><i class="fas fa-heart me-2"></i> Minha Lista de Desejos</h1>
    <p class="lead">Livros que você deseja ler</p>
</div>

<div class="container mt-4">
    <div th:if="${#lists.isEmpty(desejos)}" class="alert alert-info text-center">
        Você ainda não adicionou livros à sua lista de desejos.
    </div>

    <div class="row g-4" th:each="livro : ${desejos}">
        <div class="col-md-4">
            <div class="card card-livro p-3">
                <h5 class="fw-bold" th:text="${livro.titulo}">Título</h5>
                <p class="text-muted mb-1" th:text="${livro.autor}">Autor</p>
                <p class="small" th:text="'Categoria: ' + ${livro.categoria}">Categoria</p>
                <div class="d-flex justify-content-between align-items-center mt-3">
                    <a th:href="@{/livros/detalhes/{id}(id=${livro.id})}" class="btn btn-outline-primary btn-sm">
                        <i class="fas fa-eye me-1"></i> Ver Detalhes
                    </a>
                    <form th:action="@{/perfil/desejos/remover/{id}(id=${livro.id})}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button class="btn btn-outline-danger btn-sm"><i class="fas fa-trash"></i></button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="text-center mt-4">
        <a th:href="@{/perfil/meu}" class="btn btn-outline-primary"><i class="fas fa-arrow-left me-1"></i> Voltar ao Perfil</a>
    </div>
</div>
</body>
</html>
