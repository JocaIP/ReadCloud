<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil | ReadCloud</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --primary: #8B4513;
            --accent: #A0522D;
            --light: #F8F8F8;
        }

        body {
            background: var(--light);
            font-family: "Segoe UI", system-ui, sans-serif;
        }

        .topbar {
            background: linear-gradient(90deg, var(--primary), var(--accent));
            color: #fff;
            padding: 16px 24px;
        }

        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
        }

        .stat-card {
            background: white;
            padding: 1.5rem;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .stat-card i {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            color: var(--primary);
        }

        .book-cover {
            height: 100px;
            width: 70px;
            object-fit: cover;
            border-radius: 4px;
        }

        .badge-status {
            border-radius: 8px;
            padding: 4px 8px;
            font-size: 0.85rem;
            color: white;
        }

        .badge-status.ativo { background: #28a745; }
        .badge-status.atrasado { background: #dc3545; }
        .badge-status.devolvido { background: #6c757d; }
    </style>
</head>
<body>

<div class="topbar d-flex justify-content-between align-items-center">
    <h5 class="mb-0"><i class="fas fa-user-circle me-2"></i> Meu Perfil</h5>
    <a th:href="@{/}" class="btn btn-outline-light btn-sm">
        <i class="fas fa-home me-1"></i> Início
    </a>
</div>

<div class="container my-4">
    <div class="row g-3 mb-4">
        <div class="col-md-3">
            <div class="stat-card">
                <i class="fas fa-book"></i>
                <h5 class="fw-bold mb-0" th:text="${totalEmprestimosAtivos}">0</h5>
                <small>Empréstimos Ativos</small>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card">
                <i class="fas fa-heart"></i>
                <h5 class="fw-bold mb-0" th:text="${totalDesejos}">0</h5>
                <small>Livros Favoritos</small>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card">
                <i class="fas fa-exclamation-circle"></i>
                <h5 class="fw-bold mb-0" th:text="${#lists.size(atrasos)}">0</h5>
                <small>Atrasos</small>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card">
                <i class="fas fa-clock-rotate-left"></i>
                <h5 class="fw-bold mb-0" th:text="${#lists.size(historico)}">0</h5>
                <small>Histórico</small>
            </div>
        </div>
    </div>

    <h5 class="mb-3"><i class="fas fa-book-reader me-2"></i> Meus Empréstimos Ativos</h5>

    <div class="card p-3">
        <div th:if="${#lists.isEmpty(emprestimos)}" class="alert alert-info mb-0 text-center">
            <i class="fas fa-info-circle me-1"></i> Nenhum empréstimo ativo.
        </div>

        <div class="row g-3" th:each="emp : ${emprestimos}">
            <div class="col-md-6 col-lg-4">
                <div class="border rounded p-3 bg-white h-100 d-flex align-items-center gap-3">
                    <img th:if="${emp.livro.imagemCapa != null}"
                         th:src="@{'/uploads/' + ${emp.livro.imagemCapa}}"
                         class="book-cover">
                    <div>
                        <strong th:text="${emp.livro.titulo}">Livro</strong><br>
                        <small class="text-muted" th:text="${#temporals.format(emp.dataEmprestimo, 'dd/MM/yyyy')}">10/11/2025</small><br>
                        <span class="badge-status ativo">Ativo</span>
                    </div>
                    <form th:action="@{|/perfil/devolver/${emp.id}|}" method="post" class="ms-auto">
                        <button class="btn btn-outline-danger btn-sm">
                            <i class="fas fa-undo me-1"></i> Devolver
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
