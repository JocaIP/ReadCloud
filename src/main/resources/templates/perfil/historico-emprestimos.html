<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Histórico de Empréstimos - ReadCloud</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', sans-serif; }
        .header { background: linear-gradient(135deg, #8B4513, #A0522D); color: white; padding: 2.5rem 1rem; text-align: center; border-radius: 0 0 25px 25px; }
        .card-historico { background: #fff; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border-left: 5px solid #A0522D; transition: 0.3s; }
        .card-historico:hover { transform: translateY(-5px); }
    </style>
</head>
<body>
<div class="header">
    <h1><i class="fas fa-clock me-2"></i> Histórico de Empréstimos</h1>
    <p class="lead">Acompanhe os livros que você já leu</p>
</div>

<div class="container mt-4">
    <div th:if="${#lists.isEmpty(historico)}" class="alert alert-info text-center">
        Você ainda não possui histórico de empréstimos.
    </div>

    <div class="row g-3" th:each="emp : ${historico}">
        <div class="col-md-6">
            <div class="card card-historico p-3">
                <h5 class="fw-bold" th:text="${emp.livro.titulo}">Título do Livro</h5>
                <p class="mb-1"><i class="fas fa-calendar-alt me-1"></i> Empréstimo: <span th:text="${#temporals.format(emp.dataEmprestimo, 'dd/MM/yyyy')}"></span></p>
                <p class="mb-1"><i class="fas fa-calendar-times me-1"></i> Devolvido em: <span th:text="${#temporals.format(emp.dataDevolucao, 'dd/MM/yyyy')}"></span></p>
                <p class="mb-1"><i class="fas fa-check text-success me-1"></i> <b>Status:</b> Devolvido</p>
            </div>
        </div>
    </div>

    <div class="text-center mt-4">
        <a th:href="@{/perfil/meu}" class="btn btn-outline-primary"><i class="fas fa-arrow-left me-1"></i> Voltar ao Perfil</a>
    </div>
</div>
</body>
</html>
