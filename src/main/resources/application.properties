# ============================================================
# BANCO DE DADOS - AZURE SQL SERVER
# ============================================================
spring.datasource.url=jdbc:sqlserver://readcloud.database.windows.net:1433;database=ReadCloudDB;encrypt=true;trustServerCertificate=false;loginTimeout=30;
spring.datasource.username=readcloud
spring.datasource.password=Pietra2109@
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect


# ============================================================
# THYMELEAF
# ============================================================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false


# ============================================================
# SERVER
# ============================================================
server.port=8081


# ============================================================
# UPLOAD DE ARQUIVOS (IMAGEM DE CAPA)
# ============================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
